name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresca datos cada 30 minutos (en los minutos 0 y 30 de cada hora)
    - cron: "0,30 * * * *"
  workflow_dispatch:
# ---
# Este workflow refresca los datos de gasolineras y electrolineras cada 30 minutos usando GitHub Actions.
#
# - El script scripts/fetch-fuel-data.mjs descarga ambos tipos de datos y los guarda en public/sampledata.json.
# - El límite de la API de electrolineras (REVE) se respeta automáticamente.
# - Todos los usuarios consumen el mismo snapshot actualizado.
#
# Para cambiar la frecuencia, ajusta el campo 'cron' arriba.
#
# Si necesitas forzar un refresh manual, puedes lanzar el workflow desde la pestaña Actions de GitHub.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Refresh official fuel data
        run: npm run update:data
        env:
          REVE_API_KEY: ${{ secrets.REVE_API_KEY }}
      - name: Persist refreshed sampledata
        run: |
          if git diff --quiet -- public/sampledata.json sampledata/sampledata.json; then
            echo "No sampledata changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sampledata.json sampledata/sampledata.json
          git commit -m "chore(data): refresh sampledata [skip ci]"
          git push
      - name: Build
        run: GITHUB_PAGES=true npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID || 'G-CQ3MN53CLR' }}
          VITE_APP_VERSION: ${{ github.run_number }}-${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
